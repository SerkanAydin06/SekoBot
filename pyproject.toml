[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sekobot"
version = "0.1.0"
description = "Windows game-window viewer and future automation platform"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "mss>=10.1,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sekobot = "sekobot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
