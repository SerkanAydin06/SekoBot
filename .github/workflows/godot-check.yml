name: Godot and Windows helper checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  godot-scene:
    name: Godot 4.5 scene smoke test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Import and parse Godot scene
        shell: bash
        run: |
          godot --headless --path . --import --quit
          godot --headless --path . --quit-after 5 > godot-smoke.log 2>&1
          cat godot-smoke.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed loading resource|Could not load script' godot-smoke.log; then
            echo "Godot scene/script diagnostics were found."
            exit 1
          fi

  win32-helper:
    name: Native helper compiles in Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile helper without Python or .NET SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -Path ".\tools\WindowNative.cs" -ReferencedAssemblies "System.Drawing"
          [SekoBot.WindowNative]::InitializeDpi()
          $windows = [SekoBot.WindowNative]::ListWindows()
          Write-Host ("Enumeration returned {0} desktop windows." -f @($windows).Count)
