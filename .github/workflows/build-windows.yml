name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main build mid-release: that leaves a new EXE next to an old manifest.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Test + standalone Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Embed build identity
        shell: pwsh
        run: |
          $version = "0.4.${{ github.run_number }}"
          $code = "namespace SekoBot; internal static class BuildInfo { internal const string Commit = `"$env:GITHUB_SHA`"; internal const string Version = `"$version`"; }"
          Set-Content -Path src/SekoBot/BuildInfo.cs -Value $code -Encoding utf8

      - name: Test
        run: dotnet test tests/SekoBot.Tests/SekoBot.Tests.csproj -c Release

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/SekoBot/SekoBot.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
          if (-not (Test-Path publish/SekoBot.exe)) { throw "SekoBot.exe was not generated." }
          $hash = (Get-FileHash publish/SekoBot.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item publish/SekoBot.exe).Length
          @{ commit = $env:GITHUB_SHA; sha256 = $hash; length = $size } |
            ConvertTo-Json -Compress | Set-Content -Path publish/SekoBot.manifest.json -Encoding utf8
          "SekoBot.exe: $size bytes, sha256 $hash"

      - name: Publish rolling preview release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: SekoBot - Güncel Windows Sürümü
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            publish/SekoBot.exe
            publish/SekoBot.manifest.json
          body: |
            Tek dosyalı Windows x64 SekoBot. Kurulum gerekmez; açılışta kendini otomatik günceller.
            Kod commit'i: ${{ github.sha }}
