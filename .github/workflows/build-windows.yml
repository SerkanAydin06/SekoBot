name: Windows EXE Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: SekoBot.exe (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for build runner only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pyinstaller>=6.11,<7"

      - name: Run automated tests
        run: |
          python -m compileall -q src
          python -m pytest -q

      - name: Build standalone executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SekoBot --paths src --collect-submodules mss src/sekobot/__main__.py
          if (-not (Test-Path "dist/SekoBot.exe")) {
            throw "SekoBot.exe was not generated."
          }
          Get-Item "dist/SekoBot.exe" | Select-Object Name, Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SekoBot-Windows-x64
          path: dist/SekoBot.exe
          if-no-files-found: error
          retention-days: 30
